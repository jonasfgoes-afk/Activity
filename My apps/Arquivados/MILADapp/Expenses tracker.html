<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>extra expense tracker · mini</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(145deg, #f0f4f8 0%, #e6ecf3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1rem;
        }
        .card {
            max-width: 680px;
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 2rem;
            box-shadow: 0 20px 35px -8px rgba(0, 20, 30, 0.25), inset 0 0 0 1px rgba(255,255,255,0.5);
            padding: 2rem 1.8rem;
            border: 1px solid rgba(255,255,255,0.5);
        }
        h1 {
            font-size: 2.1rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #1a2e3f;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.1rem;
        }
        h1 span {
            background: #2f4858;
            color: white;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            margin-left: 0.75rem;
            letter-spacing: normal;
            vertical-align: middle;
        }
        .sub {
            color: #4a6572;
            font-size: 0.95rem;
            margin-bottom: 1.8rem;
            border-left: 4px solid #7f9eb5;
            padding-left: 1rem;
            font-weight: 400;
        }
        .input-panel {
            background: white;
            border-radius: 2rem;
            padding: 1.25rem 1.5rem;
            box-shadow: 0 8px 18px -8px rgba(0,32,64,0.08);
            border: 1px solid rgba(158, 184, 206, 0.2);
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 1rem;
        }
        .field {
            flex: 1 1 180px;
            min-width: 160px;
        }
        .field label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            color: #446688;
            margin-bottom: 0.3rem;
        }
        .field input {
            width: 100%;
            border: none;
            border-bottom: 2px solid #cbd6e4;
            background: transparent;
            padding: 0.5rem 0.25rem;
            font-size: 1.2rem;
            font-weight: 500;
            color: #1d3a4e;
            outline: none;
            transition: 0.15s;
        }
        .field input:focus {
            border-bottom-color: #2f7c9e;
        }
        .field input[type="number"] {
            -moz-appearance: textfield;
        }
        .field input[type="number"]::-webkit-outer-spin-button,
        .field input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .add-btn {
            background: #1f5f8f;
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.7rem 2rem;
            border-radius: 40px;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 14px -6px #1f5f8f60;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid #ffffff40;
            white-space: nowrap;
        }
        .add-btn:hover {
            background: #0b4b73;
            transform: scale(1.02);
            box-shadow: 0 10px 18px -6px #0b3550;
        }
        .expense-list {
            background: rgba(255,255,255,0.5);
            border-radius: 1.5rem;
            padding: 0.2rem 0.2rem 0.2rem 1.2rem;
            margin: 1.8rem 0 1.5rem 0;
            max-height: 320px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #a0c0d0 #eef3f8;
        }
        .expense-list::-webkit-scrollbar {
            width: 6px;
        }
        .expense-list::-webkit-scrollbar-track {
            background: #eef3f8;
            border-radius: 10px;
        }
        .expense-list::-webkit-scrollbar-thumb {
            background: #a0c0d0;
            border-radius: 10px;
        }
        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.9rem 1rem 0.9rem 0.5rem;
            border-bottom: 1px solid #d3e1ec;
            animation: fadeIn 0.2s ease;
        }
        .list-item:last-child {
            border-bottom: none;
        }
        .item-info {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0.8rem 1.5rem;
        }
        .purchase {
            font-weight: 600;
            font-size: 1.1rem;
            color: #173042;
            word-break: break-word;
            max-width: 260px;
        }
        .price {
            background: #d9e7f2;
            padding: 0.25rem 1rem;
            border-radius: 30px;
            font-weight: 600;
            color: #0b4057;
            font-size: 1rem;
            white-space: nowrap;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #8fabbd;
            font-size: 1.4rem;
            line-height: 1;
            cursor: pointer;
            padding: 0 0.4rem;
            transition: 0.1s;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .delete-btn:hover {
            color: #bc3f3f;
            background: #ffe9e9;
            transform: scale(1.1);
        }
        .total-area {
            background: #1d3749;
            border-radius: 3rem;
            padding: 1.2rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: inset 0 2px 3px #ffffff20, 0 12px 22px -10px #0e2a38;
            border: 1px solid #628ca0;
            margin-top: 1.2rem;
        }
        .total-label {
            font-size: 1.3rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #e0f0fa;
        }
        .total-value {
            font-size: 2.2rem;
            font-weight: 700;
            background: #ffffff15;
            padding: 0.2rem 1.5rem;
            border-radius: 3rem;
            color: white;
            text-shadow: 0 2px 3px #00000020;
            border: 1px solid #ffffff60;
        }
        .empty-message {
            text-align: center;
            color: #6e8ca0;
            font-style: italic;
            padding: 1.8rem 0;
            font-size: 1rem;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(4px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .footer-note {
            font-size: 0.75rem;
            color: #8ba0b0;
            text-align: right;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>
        ✦ extra expenses
        <span>pocket</span>
    </h1>
    <div class="sub">just add · track · total updates</div>

    <!-- input row -->
    <div class="input-panel">
        <div class="field">
            <label for="purchaseInput">purchase</label>
            <input type="text" id="purchaseInput" placeholder="e.g. coffee" autocomplete="off">
        </div>
        <div class="field">
            <label for="priceInput">price ($)</label>
            <input type="number" id="priceInput" step="0.01" min="0" placeholder="0.00">
        </div>
        <button class="add-btn" id="addBtn">
            <span style="font-size:1.4em;">+</span> add
        </button>
    </div>

    <!-- dynamic list of expenses -->
    <div class="expense-list" id="expenseListContainer">
        <!-- items will be injected via js -->
        <div class="empty-message" id="emptyPlaceholder">✨ no expenses yet — add one above</div>
    </div>

    <!-- total field (the requested total) -->
    <div class="total-area">
        <span class="total-label">TOTAL</span>
        <span class="total-value" id="totalDisplay">$0.00</span>
    </div>
    <div class="footer-note">click ✕ on any item to delete</div>
</div>

<script>
    (function() {
        // ----- state -----
        let expenses = [];    // each item: { id, purchase, price }

        // ----- DOM elements -----
        const purchaseInput = document.getElementById('purchaseInput');
        const priceInput = document.getElementById('priceInput');
        const addBtn = document.getElementById('addBtn');
        const expenseContainer = document.getElementById('expenseListContainer');
        const totalSpan = document.getElementById('totalDisplay');
        const emptyPlaceholder = document.getElementById('emptyPlaceholder'); // we will remove it dynamically

        // helper: format currency
        const formatMoney = (value) => {
            return '$' + Number(value).toFixed(2);
        };

        // ----- render list & total -----
        function renderAll() {
            // clear container (but keep the empty message placeholder reference? we'll rebuild)
            // better: remove all children and rebuild from array
            expenseContainer.innerHTML = '';

            if (expenses.length === 0) {
                // show empty message
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'empty-message';
                emptyDiv.textContent = '✨ no expenses yet — add one above';
                expenseContainer.appendChild(emptyDiv);
            } else {
                // loop and create items
                expenses.forEach(exp => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'list-item';
                    itemDiv.dataset.id = exp.id;

                    // left side: purchase + price
                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'item-info';

                    const purchaseSpan = document.createElement('span');
                    purchaseSpan.className = 'purchase';
                    purchaseSpan.textContent = exp.purchase || '—';

                    const priceSpan = document.createElement('span');
                    priceSpan.className = 'price';
                    priceSpan.textContent = formatMoney(exp.price);

                    infoDiv.appendChild(purchaseSpan);
                    infoDiv.appendChild(priceSpan);

                    // delete button
                    const delBtn = document.createElement('button');
                    delBtn.className = 'delete-btn';
                    delBtn.setAttribute('aria-label', 'delete expense');
                    delBtn.innerHTML = '✕'; // multiplication sign ×
                    delBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteExpenseById(exp.id);
                    });

                    itemDiv.appendChild(infoDiv);
                    itemDiv.appendChild(delBtn);
                    expenseContainer.appendChild(itemDiv);
                });
            }

            // update total field
            const total = expenses.reduce((acc, cur) => acc + cur.price, 0);
            totalSpan.textContent = formatMoney(total);
        }

        // ----- delete helper -----
        function deleteExpenseById(id) {
            expenses = expenses.filter(exp => exp.id !== id);
            renderAll();
        }

        // ----- add new expense -----
        function addExpenseFromInput() {
            const purchaseRaw = purchaseInput.value.trim();
            const priceRaw = priceInput.value.trim();

            // validation
            if (purchaseRaw === '') {
                alert('Please enter a purchase description.');
                purchaseInput.focus();
                return;
            }
            if (priceRaw === '') {
                alert('Please enter the price.');
                priceInput.focus();
                return;
            }
            const priceNum = parseFloat(priceRaw);
            if (isNaN(priceNum) || priceNum < 0) {
                alert('Price must be a positive number (can be zero).');
                priceInput.value = '';
                priceInput.focus();
                return;
            }

            // create expense object
            const newExpense = {
                id: Date.now() + Math.random(),   // unique enough
                purchase: purchaseRaw,
                price: priceNum
            };

            expenses.push(newExpense);

            // re-render
            renderAll();

            // clear inputs and keep focus friendly
            purchaseInput.value = '';
            priceInput.value = '';
            purchaseInput.focus();
        }

        // ----- event listeners -----
        addBtn.addEventListener('click', addExpenseFromInput);

        // optional: hit Enter in any field triggers add
        purchaseInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                addExpenseFromInput();
            }
        });
        priceInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                addExpenseFromInput();
            }
        });

        // small sample demo data (optional, to avoid empty screen, comment if you prefer clean start)
        // uncomment next lines if you want some initial demo entries
        /*
        expenses = [
            { id: 1001, purchase: 'studio coffee', price: 4.5 },
            { id: 1002, purchase: 'notebook', price: 12.99 },
            { id: 1003, purchase: 'bus pass', price: 2.75 }
        ];
        */

        // initial render (will show empty message if no data)
        renderAll();

        // extra: focus on purchase field on page load
        purchaseInput.focus();
    })();
</script>

<!-- note: all styles and functionality are self-contained. -->
</body>
</html>
