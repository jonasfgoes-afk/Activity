<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moneyman · finance organizer</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            background: #f7f9fc;
            color: #1e293b;
        }
        button {
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 40px;
            padding: 0.4rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
            transition: 0.15s;
        }
        button:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        .primary-btn {
            background: #1e3a5f;
            border-color: #0f2b44;
            color: white;
        }
        .primary-btn:hover {
            background: #143150;
        }
        .archive-btn, .unarchive-btn {
            font-size: 0.75rem;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
        }
        .archive-btn { background: #fef3c7; border-color: #fbbf24; }
        .unarchive-btn { background: #e0f2fe; border-color: #38bdf8; }
        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin: 0.25rem 0 1.5rem 0;
            letter-spacing: -0.5px;
            color: #0f2b44;
        }
        .title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }
        #settingsToggle {
            background: #e9eef3;
            border-radius: 30px;
            padding: 0.4rem 1.5rem;
        }
        .settings-panel {
            background: white;
            border-radius: 28px;
            padding: 1.8rem 2rem;
            margin: 1.2rem 0 2.5rem 0;
            border: 1px solid #e2e8f0;
            box-shadow: 0 8px 20px rgba(0,0,0,0.02);
        }
        .settings-section {
            margin-bottom: 2rem;
        }
        .settings-section h3 {
            font-weight: 500;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .item-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }
        .item-card {
            background: #f8fafc;
            border-radius: 40px;
            padding: 0.4rem 1rem 0.4rem 1.5rem;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .item-card span {
            font-size: 0.95rem;
        }
        .tax-badge {
            background: #dbeafe;
            border-radius: 30px;
            padding: 0.2rem 0.8rem;
            font-size: 0.7rem;
            font-weight: 600;
            color: #1e40af;
        }
        .item-actions {
            display: flex;
            gap: 0.2rem;
        }
        .item-actions button {
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            font-size: 0.7rem;
            background: transparent;
            border-color: #cbd5e1;
        }
        .plan-card {
            background: white;
            border-radius: 32px;
            padding: 1.8rem 2rem;
            margin-bottom: 2rem;
            border: 1px solid #e2e8f0;
            box-shadow: 0 8px 18px rgba(0,0,0,0.02);
        }
        .plan-header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 1.8rem;
        }
        .plan-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: #0b2c4a;
            margin: 0;
        }
        .plan-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            color: #475569;
            font-size: 0.9rem;
        }
        .income-area, .dest-area {
            margin: 1.8rem 0 1.2rem 0;
        }
.income-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
    margin: 1.5rem 0;
}
.income-item {
    background: #f9f9fc;
    border-radius: 60px;
    padding: 0.8rem 1.2rem;
    border: 1px solid #e9eef3;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.8rem;
}
.income-label {
    font-weight: 500;
    min-width: 120px;
}
.income-input {
    border: 1px solid #cbd5e1;
    border-radius: 40px;
    padding: 0.4rem 1rem;
    width: 120px;
    font-size: 0.9rem;
    background: white;
}
.net-value {
    background: #e6f7e6;
    border-radius: 40px;
    padding: 0.2rem 1rem;
    font-weight: 500;
    color: #0f5c0f;
    margin-left: auto;
}
.dest-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    background: #f9f9fc;
    padding: 0.6rem 1.2rem;
    border-radius: 60px;
    margin-bottom: 0.7rem;
    border: 1px solid #e9eef3;
}
.dest-label {
    font-weight: 500;
    min-width: 120px;
}
.readonly-value {
    background: #f1f5f9;
    border-radius: 40px;
    padding: 0.2rem 1rem;
    color: #334155;
}
        .dest-total {
            background: #e9eef3;
            border-radius: 40px;
            padding: 0.2rem 1rem;
            font-weight: 500;
            min-width: 100px;
            text-align: center;
        }
        .archive-section {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 2px dashed #cbd5e1;
        }
        .archived-plan {
            background: #f1f5f9;
            opacity: 0.9;
        }
        .readonly-value {
            background: #f1f5f9;
            border-radius: 40px;
            padding: 0.2rem 1rem;
            color: #334155;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .gap-2 { gap: 0.8rem; }
        .mt-4 { margin-top: 1.5rem; }
        .text-sm { font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="title-row">
        <button id="createPlanBtn" class="primary-btn">+ Create plan</button>
        <button id="settingsToggle">⚙️ Settings</button>
    </div>
    <h1>Moneyman</h1>

    <!-- settings panel -->
    <div id="settingsPanel" class="settings-panel" style="display: none;">
        <div class="settings-section">
            <h3>💰 Income sources <span class="text-sm">(with tax option)</span></h3>
            <div id="incomesList" class="item-list"></div>
            <button id="addIncomeBtn">+ Add income</button>
        </div>
        <div class="settings-section">
            <h3>🎯 Destinations (percentage buckets)</h3>
            <div id="destinationsList" class="item-list"></div>
            <button id="addDestinationBtn">+ Add destination</button>
        </div>
    </div>

    <!-- active plans container -->
    <div id="activePlans"></div>

    <!-- archive section -->
    <div class="archive-section">
        <h2>📦 Archive</h2>
        <div id="archivePlans"></div>
    </div>

    <script>
        (function() {
            // ---------- storage ----------
            const STORAGE_KEY = 'moneyman_data';
            let appData = {
                incomes: [],        // { id, name, taxRate } (taxRate number or null)
                destinations: [],   // { id, name }
                plans: []           // { id, month, creationDate, startDate, endDate, archived, incomeValues: { incomeId: gross }, destPercentages: { destId: percentage } }
            };

            // load from localStorage
            function loadData() {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try {
                        appData = JSON.parse(saved);
                        // ensure arrays
                        appData.incomes = appData.incomes || [];
                        appData.destinations = appData.destinations || [];
                        appData.plans = appData.plans || [];
                    } catch (e) { console.warn('parse error', e); }
                }
            }
            function saveData() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
            }

            // helpers: unique id
            function genId() { return Date.now() + '-' + Math.random().toString(36).substr(2, 9); }

            // date helpers (YYYY-MM-DD)
            function todayStr() {
                const d = new Date();
                return d.toISOString().split('T')[0];
            }
            function formatDate(str) { return str; } // already YYYY-MM-DD

            function getMonthName(dateStr) {
                const d = new Date(dateStr + 'T12:00:00'); // avoid UTC issues
                return d.toLocaleString('default', { month: 'long', year: 'numeric' });
            }

            function nextDay(dateStr) {
                const d = new Date(dateStr + 'T12:00:00');
                d.setDate(d.getDate() + 1);
                return d.toISOString().split('T')[0];
            }
            function prevDay(dateStr) {
                const d = new Date(dateStr + 'T12:00:00');
                d.setDate(d.getDate() - 1);
                return d.toISOString().split('T')[0];
            }
            function getYesterday() {
                const d = new Date();
                d.setDate(d.getDate() - 1);
                return d.toISOString().split('T')[0];
            }

            // ---------- create new plan ----------
            function createNewPlan() {
                // find latest plan (by endDate) among all (including archived)
                let lastEnd = null;
                if (appData.plans.length > 0) {
                    const sorted = [...appData.plans].sort((a,b) => (a.endDate > b.endDate ? -1 : 1));
                    lastEnd = sorted[0].endDate;
                }

                let startDate, endDate;
                if (!lastEnd) {
                    // first plan: prompt for period
                    let startInput = prompt('First plan – enter START date (YYYY-MM-DD):');
                    if (!startInput) return; // cancel
                    let endInput = prompt('Enter END date (YYYY-MM-DD):');
                    if (!endInput) return;
                    // simple validation
                    if (!/^\d{4}-\d{2}-\d{2}$/.test(startInput) || !/^\d{4}-\d{2}-\d{2}$/.test(endInput)) {
                        alert('Please use format YYYY-MM-DD');
                        return;
                    }
                    startDate = startInput;
                    endDate = endInput;
                } else {
                    // auto: start = lastEnd + 1, end = yesterday
                    startDate = nextDay(lastEnd);
                    endDate = getYesterday();
                    if (startDate > endDate) {
                        alert('Warning: computed period is negative (last end is after today). Using today as end.');
                        endDate = todayStr();
                    }
                }

                const creationDate = todayStr();
                const month = getMonthName(creationDate); // month of creation

                const newPlan = {
                    id: genId(),
                    month: month,
                    creationDate: creationDate,
                    startDate: startDate,
                    endDate: endDate,
                    archived: false,
                    incomeValues: {},   // will be filled with empty for each income?
                    destPercentages: {}
                };
                // initialize with existing incomes/destinations (no values)
                appData.incomes.forEach(inc => { newPlan.incomeValues[inc.id] = ''; });
                appData.destinations.forEach(dest => { newPlan.destPercentages[dest.id] = ''; });

                appData.plans.push(newPlan);
                saveData();
                renderAll();
            }

            // ---------- archive / unarchive ----------
            function archivePlan(planId) {
                const plan = appData.plans.find(p => p.id === planId);
                if (plan) { plan.archived = true; saveData(); renderAll(); }
            }
            function unarchivePlan(planId) {
                const plan = appData.plans.find(p => p.id === planId);
                if (plan) { plan.archived = false; saveData(); renderAll(); }
            }

            // ---------- update incomes / destinations ----------
            function addIncome() {
                const name = prompt('Income name:');
                if (!name) return;
                const hasTax = confirm('Insert tax? (OK = yes, Cancel = no)');
                let taxRate = null;
                if (hasTax) {
                    let rate = prompt('Tax percentage (only number):', '0');
                    if (rate === null) return;
                    rate = parseFloat(rate);
                    if (isNaN(rate)) rate = 0;
                    taxRate = rate;
                }
                const newIncome = { id: genId(), name, taxRate };
                appData.incomes.push(newIncome);
                // add empty field to all existing NON-archived? we can add to all plans to keep structure, but archived also? easier: add to all plans (so when unarchived, it appears)
                appData.plans.forEach(p => { p.incomeValues[newIncome.id] = ''; });
                saveData();
                renderAll();
            }

            function editIncome(id) {
                const inc = appData.incomes.find(i => i.id === id);
                if (!inc) return;
                const newName = prompt('Edit income name:', inc.name);
                if (newName === null) return;
                const newTax = confirm('Has tax? (OK = yes, Cancel = no)');
                let newRate = inc.taxRate;
                if (newTax) {
                    let rate = prompt('Tax percentage:', inc.taxRate || '0');
                    if (rate === null) return;
                    newRate = parseFloat(rate) || 0;
                } else {
                    newRate = null;
                }
                inc.name = newName;
                inc.taxRate = newRate;
                saveData();
                renderAll();
            }

            function deleteIncome(id) {
                if (!confirm('Delete this income source? It will be removed from all plans.')) return;
                appData.incomes = appData.incomes.filter(i => i.id !== id);
                // remove from all plans
                appData.plans.forEach(p => { delete p.incomeValues[id]; });
                saveData();
                renderAll();
            }

            function addDestination() {
    const name = prompt('Destination name:');
    if (!name) return;
    const percentage = prompt('Default percentage (number, e.g., 10):');
    if (percentage === null) return;
    const percNum = parseFloat(percentage);
    if (isNaN(percNum)) {
        alert('Please enter a valid number.');
        return;
    }
    const newDest = { id: genId(), name, percentage: percNum };
    appData.destinations.push(newDest);
    saveData();
    renderAll();
}

function editDestination(id) {
    const dest = appData.destinations.find(d => d.id === id);
    if (!dest) return;
    const newName = prompt('Edit destination name:', dest.name);
    if (newName === null) return;
    const newPercentage = prompt('Edit default percentage (number):', dest.percentage || '');
    if (newPercentage === null) return;
    const percNum = parseFloat(newPercentage);
    if (isNaN(percNum)) {
        alert('Please enter a valid number.');
        return;
    }
    dest.name = newName;
    dest.percentage = percNum;
    saveData();
    renderAll();
}

            function deleteDestination(id) {
                if (!confirm('Delete destination? It will be removed from all plans.')) return;
                appData.destinations = appData.destinations.filter(d => d.id !== id);
                appData.plans.forEach(p => { delete p.destPercentages[id]; });
                saveData();
                renderAll();
            }

            // ---------- render all views ----------
            function renderAll() {
                renderSettingsLists();
                renderActivePlans();
                renderArchive();
            }

            function renderSettingsLists() {
                const incList = document.getElementById('incomesList');
                const destList = document.getElementById('destinationsList');
                incList.innerHTML = '';
                destList.innerHTML = '';

                appData.incomes.forEach(inc => {
                    const card = document.createElement('div');
                    card.className = 'item-card';
                    card.innerHTML = `
                        <span>${inc.name}</span>
                        ${inc.taxRate !== null ? `<span class="tax-badge">${inc.taxRate}%</span>` : ''}
                        <div class="item-actions">
                            <button class="edit-inc" data-id="${inc.id}">✎</button>
                            <button class="delete-inc" data-id="${inc.id}">✕</button>
                        </div>
                    `;
                    incList.appendChild(card);
                });
                appData.destinations.forEach(dest => {
    const card = document.createElement('div');
    card.className = 'item-card';
    card.innerHTML = `
        <span>${dest.name} (${dest.percentage || 0}%)</span>
        <div class="item-actions">
            <button class="edit-dest" data-id="${dest.id}">✎</button>
            <button class="delete-dest" data-id="${dest.id}">✕</button>
        </div>
    `;
    destList.appendChild(card);
});

                // attach listeners
                document.querySelectorAll('.edit-inc').forEach(b => b.addEventListener('click', e => editIncome(e.target.dataset.id)));
                document.querySelectorAll('.delete-inc').forEach(b => b.addEventListener('click', e => deleteIncome(e.target.dataset.id)));
                document.querySelectorAll('.edit-dest').forEach(b => b.addEventListener('click', e => editDestination(e.target.dataset.id)));
                document.querySelectorAll('.delete-dest').forEach(b => b.addEventListener('click', e => deleteDestination(e.target.dataset.id)));
            }

            function computeTotalNet(plan) {
                let total = 0;
                for (let inc of appData.incomes) {
                    const gross = parseFloat(plan.incomeValues[inc.id]) || 0;
                    if (inc.taxRate !== null && !isNaN(inc.taxRate)) {
                        total += gross * (1 - inc.taxRate / 100);
                    } else {
                        total += gross;
                    }
                }
                return total;
            }

            function renderActivePlans() {
                const container = document.getElementById('activePlans');
                const active = appData.plans.filter(p => !p.archived);
                if (active.length === 0) {
                    container.innerHTML = '<p style="color: #64748b; padding: 2rem; text-align: center;">No active plans. Click "Create plan" to start.</p>';
                    return;
                }
                container.innerHTML = '';
                active.forEach(plan => renderOnePlan(plan, false, container));
            }

            function renderArchive() {
                const container = document.getElementById('archivePlans');
                const archived = appData.plans.filter(p => p.archived);
                if (archived.length === 0) {
                    container.innerHTML = '<p style="color: #94a3b8;">Empty archive.</p>';
                    return;
                }
                container.innerHTML = '';
                archived.forEach(plan => renderOnePlan(plan, true, container));
            }

            function renderOnePlan(plan, isArchived, container) {
                const planDiv = document.createElement('div');
                planDiv.className = `plan-card ${isArchived ? 'archived-plan' : ''}`;
                const totalNet = computeTotalNet(plan);

                // header
                let headerHtml = `
                    <div class="plan-header">
                        <div>
                            <div class="plan-title">${plan.month}</div>
                            <div class="plan-meta">
                                <span>📅 created: ${plan.creationDate}</span>
                                <span>📆 period: ${plan.startDate} – ${plan.endDate}</span>
                            </div>
                        </div>
                        <div>
                `;
                if (!isArchived) {
                    headerHtml += `<button class="archive-btn" data-id="${plan.id}">Archive</button>`;
                } else {
                    headerHtml += `<button class="unarchive-btn" data-id="${plan.id}">Unarchive</button>`;
                }
                headerHtml += `</div></div>`;

                // incomes block
                let incomesHtml = '<div class="income-area"><h4>📥 Incomes</h4><div class="income-grid">';
appData.incomes.forEach(inc => {
    const gross = plan.incomeValues[inc.id] || '';
    let netDisplay = '';
    if (inc.taxRate !== null && gross) {
        const g = parseFloat(gross) || 0;
        const net = g * (1 - inc.taxRate / 100);
        netDisplay = `<span class="net-value">net: ${net.toFixed(2)}</span>`;
    } else if (gross) {
        const g = parseFloat(gross) || 0;
        netDisplay = `<span class="net-value">net: ${g.toFixed(2)}</span>`;
    }

    incomesHtml += `
        <div class="income-item">
            <span class="income-label">${inc.name} ${inc.taxRate ? '('+inc.taxRate+'% tax)' : ''}</span>
            ${isArchived ? 
                `<span class="readonly-value">${gross || '—'}</span>` : 
                `<input type="number" class="income-input" data-plan="${plan.id}" data-income="${inc.id}" value="${gross}" placeholder="gross">`
            }
            ${netDisplay ? netDisplay : ''}
        </div>
    `;
});
incomesHtml += '</div><div style="text-align:right; font-weight:600; margin-top:1rem;">💰 total net: '+totalNet.toFixed(2)+'</div></div>';

                // destinations block
                let destHtml = '<div class="dest-area"><h4>🎯 Destinations</h4>';
                appData.destinations.forEach(dest => {
    const percNum = dest.percentage || 0;
    const allocated = totalNet * (percNum / 100);
    destHtml += `
        <div class="dest-row">
            <span class="dest-label">${dest.name}</span>
            <span class="readonly-value">${percNum}%</span>
            <span class="dest-total">${allocated.toFixed(2)}</span>
        </div>
    `;
});
                destHtml += '</div>';

                planDiv.innerHTML = headerHtml + incomesHtml + destHtml;
                container.appendChild(planDiv);

                // attach event listeners for inputs (if not archived)
                if (!isArchived) {
                    planDiv.querySelectorAll('.income-input').forEach(inp => {
                        inp.addEventListener('input', function(e) {
                            const planId = this.dataset.plan;
                            const incId = this.dataset.income;
                            const val = this.value;
                            const targetPlan = appData.plans.find(p => p.id === planId);
                            if (targetPlan) {
                                targetPlan.incomeValues[incId] = val;
                                saveData();
                                renderAll();  // re-render to update totals
                            }
                        });
                    });
                    
                    // archive button
                    planDiv.querySelector('.archive-btn')?.addEventListener('click', (e) => {
                        archivePlan(plan.id);
                    });
                } else {
                    // unarchive button
                    planDiv.querySelector('.unarchive-btn')?.addEventListener('click', (e) => {
                        unarchivePlan(plan.id);
                    });
                }
            }

            // ---------- initial render & events ----------
            loadData();
            renderAll();

            document.getElementById('createPlanBtn').addEventListener('click', createNewPlan);
            document.getElementById('settingsToggle').addEventListener('click', () => {
                const panel = document.getElementById('settingsPanel');
                panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
            });
            document.getElementById('addIncomeBtn').addEventListener('click', addIncome);
            document.getElementById('addDestinationBtn').addEventListener('click', addDestination);

            // expose for debugging (optional)
            window.appData = appData;
        })();
    </script>
</body>
</html>
