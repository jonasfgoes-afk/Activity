                const name = await showModal({ title: 'New class name', bodyHtml: '<input id="modalInput" placeholder="e.g., Math 101">', input: true });
                if (!name) return;
                const daysHtml = `<div class="checkbox-group" id="dayCheckboxes">${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map(d => `<label><input type="checkbox" value="${d}"> ${d}</label>`).join('')}</div>`;
                const selectedDays = await showModal({ title: 'Select class days', bodyHtml: daysHtml, confirmText: 'Save', input: false });
                if (!selectedDays) return;
                const checkboxes = document.querySelectorAll('#dayCheckboxes input:checked');
                const days = Array.from(checkboxes).map(cb => cb.value);
                if (days.length === 0) { showAlert('Select at least one day'); return; }
                data.classes.push({ id: generateId(), institutionId: state.institutionId, name, days, override: { behaviors: [], defaultTimerSeconds: null, timerSoundDataURL: null, limit: null, consequence: null } });
                saveData(data); render();
            });

            document.querySelectorAll('[data-action="editClass"]').forEach(b => b.addEventListener('click', async (e) => {
                const id = e.target.closest('button').dataset.id;
                const cls = data.classes.find(c => c.id === id);
                if (!cls) return;
                const daysHtml = `<div class="checkbox-group" id="dayCheckboxes">${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map(d => {
                    const checked = cls.days && cls.days.includes(d) ? 'checked' : '';
                    return `<label><input type="checkbox" value="${d}" ${checked}> ${d}</label>`;
                }).join('')}</div>`;
                const bodyHtml = `
                    <input id="classNameInput" placeholder="Class name" value="${escapeHtml(cls.name)}" style="width:100%; margin-bottom:1rem;">
                    ${daysHtml}
                `;
                const result = await showModal({
                    title: 'Edit class',
                    bodyHtml,
                    showCancel: true,
                    confirmText: 'Save',
                    cancelText: 'Cancel',
                    input: false
                });
                if (!result) return;
                const newName = document.getElementById('classNameInput').value;
                const checkboxes = document.querySelectorAll('#dayCheckboxes input:checked');
                const days = Array.from(checkboxes).map(cb => cb.value);
                if (!newName.trim()) { showAlert('Name cannot be empty'); return; }
                if (days.length === 0) { showAlert('Select at least one day'); return; }
                cls.name = newName.trim();
                cls.days = days;
                saveData(data);
                render();
            }));

            document.querySelectorAll('[data-action="deleteClass"]').forEach(b => b.addEventListener('click', async (e) => {
                const id = e.target.closest('button').dataset.id; const name = e.target.closest('button').dataset.name;
                if (!await showModal({ title: 'Delete class name?', bodyHtml: '<p>Are you sure?</p>' })) return;
                const typed = await showModal({ title: 'Confirm', bodyHtml: `<p>Type "${escapeHtml(name)}"</p><input id="modalInput">`, input: true });
                if (typed !== name) { showAlert('Incorrect'); return; }
                const classIds = [id]; const lessonIds = data.lessons.filter(l => l.classId === id).map(l => l.id);
                data.classes = data.classes.filter(c => c.id !== id);
                data.students = data.students.filter(s => s.classId !== id);
                data.lessons = data.lessons.filter(l => l.classId !== id);
                data.behaviorEvents = data.behaviorEvents.filter(be => !lessonIds.includes(be.lessonId));
                saveData(data); render();
            }));

            document.querySelectorAll('[data-action="daysOfClass"]').forEach(b => b.addEventListener('click', (e) => {
                state.classId = e.target.closest('button').dataset.id; state.className = e.target.closest('button').dataset.name;
                setView('lessons', { classId: state.classId, className: state.className });
            }));

            document.querySelectorAll('[data-action="studentsClass"]').forEach(b => b.addEventListener('click', (e) => {
                state.classId = e.target.closest('button').dataset.id; state.className = e.target.closest('button').dataset.name;
                setView('students', { classId: state.classId, className: state.className });
            }));

            document.querySelectorAll('[data-action="settingsClass"]').forEach(b => b.addEventListener('click', (e) => {
                state.classId = e.target.closest('button').dataset.id; state.className = e.target.closest('button').dataset.name;
                setView('classSettings', { classId: state.classId, className: state.className });
            }));
        }

        // ---------- STUDENTS (removed "Days of class" button) ----------
        function renderStudents(container, data) {
            container.innerHTML = `
                <div class="section-title">
                    <button class="btn" id="backToClasses"><i class="fas fa-arrow-left"></i> Class names</button>
                    <span>👥 ${escapeHtml(state.className)}</span>
                    <button class="btn btn-primary" id="addStudentBtn"><i class="fas fa-user-plus"></i> Add students</button>
                </div>
                <div id="studentList"></div>
            `;
            const listDiv = document.getElementById('studentList');
            data.students.filter(s => s.classId === state.classId).forEach(s => {
                const div = document.createElement('div');
                div.className = 'student-row';
                div.innerHTML = `
                    <span class="student-name">${escapeHtml(s.name)}</span>
                    <div>
                        <button class="icon-btn" data-id="${s.id}" data-action="editStudent"><i class="fas fa-edit"></i></button>
                        <button class="icon-btn" data-id="${s.id}" data-action="deleteStudent"><i class="fas fa-trash"></i></button>
                        <button class="icon-btn" data-id="${s.id}" data-action="reportStudent"><i class="fas fa-chart-bar"></i></button>
                    </div>
                `;
                listDiv.appendChild(div);
            });

            document.getElementById('backToClasses').addEventListener('click', () => setView('classes'));

            document.getElementById('addStudentBtn').addEventListener('click', async () => {
                const choice = await new Promise((resolve) => {
                    const modalDiv = document.getElementById('customModal');
                    document.getElementById('modalTitle').innerText = 'Add students';
                    document.getElementById('modalBody').innerHTML = `
                        <button class="btn" id="chooseManual" style="width:100%; margin-bottom:10px;">➕ Manual entry</button>
                        <button class="btn" id="chooseImport" style="width:100%;">📋 Import from column</button>
                    `;
                    const actionsDiv = document.getElementById('modalActions');
                    actionsDiv.innerHTML = '<button class="btn" id="cancelAdd">Cancel</button>';
                    document.getElementById('cancelAdd').onclick = () => { closeModal(); resolve(null); };
                    document.getElementById('chooseManual').onclick = () => { closeModal(); resolve('manual'); };
                    document.getElementById('chooseImport').onclick = () => { closeModal(); resolve('import'); };
                    modalDiv.classList.add('active');
                });
                if (!choice) return;
                if (choice === 'manual') {
                    const name = await showModal({ title: 'Manual entry', bodyHtml: '<input id="modalInput" placeholder="Student name">', input: true });
                    if (name && name.trim()) {
                        data.students.push({ id: generateId(), classId: state.classId, name: name.trim() });
                        saveData(data); render();
                    }
                } else {
                    const text = await showModal({ title: 'Import names', bodyHtml: '<textarea id="modalInput" rows="6" placeholder="One name per line"></textarea>', input: true });
                    if (text) {
                        const names = text.split('\n').map(s => s.trim()).filter(s => s);
                        names.forEach(n => data.students.push({ id: generateId(), classId: state.classId, name: n }));
                        saveData(data); render();
                        showAlert(`Added ${names.length} student(s).`);
                    }
                }
            });

            document.querySelectorAll('[data-action="editStudent"]').forEach(b => b.addEventListener('click', async (e) => {
                const id = e.target.closest('button').dataset.id;
                const student = data.students.find(s => s.id === id);
                if (!student) return;
                const newName = await showModal({ title: 'Edit student name', bodyHtml: `<input id="modalInput" value="${escapeHtml(student.name)}">`, input: true });
                if (newName && newName.trim()) {
                    student.name = newName.trim();
                    saveData(data); render();
                }
            }));

            document.querySelectorAll('[data-action="deleteStudent"]').forEach(b => b.addEventListener('click', async (e) => {
                const id = e.target.closest('button').dataset.id;
                if (await showModal({ title: 'Delete student', bodyHtml: '<p>Remove this student?</p>' })) {
                    data.students = data.students.filter(s => s.id !== id);
                    data.behaviorEvents = data.behaviorEvents.filter(be => be.studentId !== id);
                    saveData(data); render();
                }
            }));

            document.querySelectorAll('[data-action="reportStudent"]').forEach(b => b.addEventListener('click', (e) => {
                const studentId = e.target.closest('button').dataset.id;
                const student = data.students.find(s => s.id === studentId);
                if (student) {
                    setView('behaviorHistory', { studentId: student.id, studentName: student.name });
                }
            }));
        }

        // ---------- LESSONS (with day of week) ----------
        function renderLessons(container, data) {
            const classLessons = data.lessons.filter(l => l.classId === state.classId);
            const activeLessons = classLessons.filter(l => !l.archived);
            const archivedLessons = classLessons.filter(l => l.archived);

            container.innerHTML = `
                <div class="section-title">
                    <button class="btn" id="backToClasses"><i class="fas fa-arrow-left"></i> Class names</button>
                    <span>📅 Days of class · ${escapeHtml(state.className)}</span>
                    <button class="btn btn-primary" id="createLessonBtn"><i class="fas fa-plus"></i> Create class day</button>
                </div>
                <h3>Active days</h3>
                <div class="card-grid" id="activeLessonGrid"></div>
                ${archivedLessons.length > 0 ? `
                    <div class="archive-section">
                        <div class="archive-title"><i class="fas fa-archive"></i> Archived days</div>
                        <div class="card-grid" id="archivedLessonGrid"></div>
                    </div>
                ` : ''}
            `;

            const activeGrid = document.getElementById('activeLessonGrid');
            activeLessons.forEach(lesson => {
                const card = document.createElement('div'); card.className = 'card';
                const dateStr = lesson.date ? new Date(lesson.date + 'T12:00:00').toLocaleDateString() : 'No date';
                const dayOfWeek = lesson.date ? getDayOfWeek(lesson.date) : '';
                card.innerHTML = `
                    <div><strong>${escapeHtml(dayOfWeek)}</strong> ${escapeHtml(dateStr)}</div>
                    <div style="display: flex; gap: 0.5rem; margin-top: 0.8rem;">
                        <button class="btn btn-sm" data-id="${lesson.id}" data-action="openLesson">open</button>
                        <button class="btn btn-sm" data-id="${lesson.id}" data-action="archiveLesson"><i class="fas fa-archive"></i> Archive</button>
                        <button class="btn btn-sm btn-danger" data-id="${lesson.id}" data-action="deleteLesson"><i class="fas fa-trash"></i></button>
                    </div>
                `;
                activeGrid.appendChild(card);
            });

            if (archivedLessons.length > 0) {
                const archivedGrid = document.getElementById('archivedLessonGrid');
                archivedLessons.forEach(lesson => {
                    const card = document.createElement('div'); card.className = 'card';
                    const dateStr = lesson.date ? new Date(lesson.date + 'T12:00:00').toLocaleDateString() : 'No date';
                    const dayOfWeek = lesson.date ? getDayOfWeek(lesson.date) : '';
                    card.innerHTML = `
                        <div><strong>${escapeHtml(dayOfWeek)}</strong> ${escapeHtml(dateStr)}</div>
                        <div style="display: flex; gap: 0.5rem; margin-top: 0.8rem;">
                            <button class="btn btn-sm" data-id="${lesson.id}" data-action="openLesson">open</button>
                            <button class="btn btn-sm btn-danger" data-id="${lesson.id}" data-action="deleteLesson"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                    archivedGrid.appendChild(card);
                });
            }

            document.getElementById('backToClasses').addEventListener('click', () => setView('classes'));

            document.getElementById('createLessonBtn').addEventListener('click', async () => {
                const classObj = data.classes.find(c => c.id === state.classId);
                if (!classObj || !classObj.days || classObj.days.length === 0) {
                    showAlert('This class has no days selected.'); return;
                }
                const nextMissing = getNextMissingClassDate(classObj, data);
                if (!nextMissing) {
                    showAlert('No upcoming class days available without an active lesson in the next 60 days.');
                    return;
                }
                data.lessons.push({
                    id: generateId(),
                    classId: state.classId,
                    date: nextMissing,
                    archived: false
                });
                saveData(data);
                render();
                showAlert(`Created class day for ${new Date(nextMissing + 'T12:00:00').toLocaleDateString()}`);
            });

            document.querySelectorAll('[data-action="archiveLesson"]').forEach(b => b.addEventListener('click', async (e) => {
                const lessonId = e.target.closest('button').dataset.id;
                const lesson = data.lessons.find(l => l.id === lessonId);
                if (!lesson) return;
                const confirmArchive = await showModal({ title: 'Archive class day?', bodyHtml: `<p>Move this day to archive?</p>`, confirmText: 'Archive', cancelText: 'Cancel' });
                if (!confirmArchive) return;
                lesson.archived = true;
                saveData(data);
                render();
            }));

            document.querySelectorAll('[data-action="deleteLesson"]').forEach(b => b.addEventListener('click', async (e) => {
                const lessonId = e.target.closest('button').dataset.id;
                const lesson = data.lessons.find(l => l.id === lessonId);
                if (!lesson) return;
                if (!await showModal({ title: 'Delete class day?', bodyHtml: '<p>Are you sure you want to delete this class day?</p>' })) return;
                const typed = await showModal({ title: 'Confirm deletion', bodyHtml: `<p>Type the class name "<strong>${escapeHtml(state.className)}</strong>" to confirm:</p><input id="modalInput">`, input: true });
                if (typed !== state.className) { showAlert('Incorrect class name.'); return; }
                data.lessons = data.lessons.filter(l => l.id !== lessonId);
                data.behaviorEvents = data.behaviorEvents.filter(be => be.lessonId !== lessonId);
                saveData(data);
                render();
            }));

            document.querySelectorAll('[data-action="openLesson"]').forEach(b => b.addEventListener('click', (e) => {
                state.lessonId = e.target.closest('button').dataset.id;
                setView('lessonDetail', { lessonId: state.lessonId });
            }));
        }

        // ---------- LESSON DETAIL (unchanged, with dice) ----------
        function renderLessonDetail(container, data) {
            const effective = getEffectiveSettings(data, state.institutionId, state.classId);
            const limit = effective.limit;
            const consequence = effective.consequence;
            const defaultTimer = effective.defaultTimerSeconds;
            const timerSound = effective.timerSoundDataURL;
            const lesson = data.lessons.find(l => l.id === state.lessonId);
            const lessonDate = lesson ? new Date(lesson.date + 'T12:00:00').toLocaleDateString() : '';

            const lessonBehaviors = data.behaviorEvents.filter(be => be.lessonId === state.lessonId);
            const studentMap = {};
            data.students.filter(s => s.classId === state.classId).forEach(s => {
                studentMap[s.id] = { name: s.name, appropriate: [], inappropriate: [] };
            });
            lessonBehaviors.forEach(be => {
                if (studentMap[be.studentId]) {
                    if (be.type === 'appropriate') studentMap[be.studentId].appropriate.push(be);
                    else studentMap[be.studentId].inappropriate.push(be);
                }
            });

            if (!timers[state.lessonId]) timers[state.lessonId] = {};

            Object.keys(timers[state.lessonId]).forEach(studentId => {
                const student = studentMap[studentId];
                if (!student || student.inappropriate.length < limit) {
                    const timer = timers[state.lessonId][studentId];
                    if (timer && timer.intervalId) clearInterval(timer.intervalId);
                    delete timers[state.lessonId][studentId];
                }
            });

            Object.entries(studentMap).forEach(([studentId, student]) => {
                if (student.inappropriate.length >= limit && !timers[state.lessonId][studentId]) {
                    timers[state.lessonId][studentId] = {
                        remaining: defaultTimer,
                        running: false,
                        intervalId: null,
                        alarmActive: false
                    };
                }
            });

            let headerHtml = `<div class="lesson-header">
                <span><strong>🏫 Institution:</strong> ${escapeHtml(state.institutionName)}</span>
                <span><strong>📚 Class:</strong> ${escapeHtml(state.className)}</span>
                <span><strong>📅 Date:</strong> ${escapeHtml(lessonDate)}</span>
                <span class="dice-button" id="drawStudentBtn" title="Draw a student with fewest appropriate behaviors"><i class="fas fa-dice"></i></span>
            </div>`;

            let tableHtml = `<div class="table-container"><div class="lesson-table">
                <div class="table-header">Student</div>
                <div class="table-header">😊 / 😞</div>
                <div class="table-header">Behaviors</div>
                <div class="table-header">Undo</div>
                <div class="table-header">Timer</div>`;

            Object.entries(studentMap).forEach(([studentId, rec]) => {
                const appCount = rec.appropriate.length;
                const inappCount = rec.inappropriate.length;
                const behaviorTexts = [...rec.appropriate.map(b => escapeHtml(b.description)), ...rec.inappropriate.map(b => escapeHtml(b.description))].join(', ');
                const timer = timers[state.lessonId][studentId];
                const hasTimer = !!timer;

                const smileHtml = `
                    <div class="smile-with-count">
                        <div class="smile-item">
                            <span class="clickable-smile" data-student="${studentId}" data-type="appropriate">😊</span>
                            <span class="count-badge">${appCount}</span>
                        </div>
                        <div class="smile-item">
                            <span class="clickable-smile" data-student="${studentId}" data-type="inappropriate">😞</span>
                            <span class="count-badge">${inappCount}</span>
                        </div>
                    </div>
                `;

                let timerCell = '';
                if (hasTimer) {
                    const remaining = timer.remaining;
                    const alarmActive = timer.alarmActive;
                    if (alarmActive) {
                        timerCell = `
                            <button class="timer-btn stop-alarm" data-student="${studentId}" data-action="stopAlarm" title="Stop alarm and prompt apology"><i class="fas fa-stop"></i> Stop</button>
                        `;
                    } else {
                        timerCell = `
                            <span class="timer-display" id="timer-${studentId}">${formatTime(remaining)}</span>
                            <button class="timer-btn" data-student="${studentId}" data-action="startTimer"><i class="fas fa-play"></i></button>
                            <button class="timer-btn" data-student="${studentId}" data-action="pauseTimer"><i class="fas fa-pause"></i></button>
                            <button class="timer-btn" data-student="${studentId}" data-action="resetTimer"><i class="fas fa-undo-alt"></i></button>
                        `;
                    }
                } else {
                    timerCell = '<span class="timer-placeholder">—</span>';
                }

                tableHtml += `
                    <div class="table-cell student-name-cell">${escapeHtml(rec.name)}</div>
                    <div class="table-cell">${smileHtml}</div>
                    <div class="table-cell">${behaviorTexts}</div>
                    <div class="table-cell">
                        <button class="undo-btn" data-student="${studentId}" title="Undo last behavior"><i class="fas fa-undo-alt"></i></button>
                    </div>
                    <div class="table-cell">
                        <div class="timer-controls" id="timer-controls-${studentId}">
                            ${timerCell}
                        </div>
                    </div>
                `;
            });

            tableHtml += '</div></div><button class="btn mt-2" id="closeLesson">Back to days</button>';
            container.innerHTML = headerHtml + tableHtml;

            // Draw student button logic
            document.getElementById('drawStudentBtn')?.addEventListener('click', () => {
                const students = Object.entries(studentMap).map(([id, rec]) => ({
                    id,
                    name: rec.name,
                    appropriateCount: rec.appropriate.length
                }));
                if (students.length === 0) {
                    showAlert('No students in this class.');
                    return;
                }
                const minCount = Math.min(...students.map(s => s.appropriateCount));
                const candidates = students.filter(s => s.appropriateCount === minCount);
                candidates.sort((a, b) => a.name.localeCompare(b.name));
                const chosen = candidates[0];
                showAlert(`🎲 Draw result: ${chosen.name} (${chosen.appropriateCount} positive behaviors)`);
            });

            // Event handlers (same as before)
            document.querySelectorAll('[data-action="startTimer"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const studentId = e.currentTarget.dataset.student;
                    const timer = timers[state.lessonId][studentId];
                    if (!timer || timer.running || timer.alarmActive) return;
                    timer.running = true;
                    timer.intervalId = setInterval(() => {
                        if (timer.remaining > 0) {
                            timer.remaining--;
                            const disp = document.getElementById(`timer-${studentId}`);
                            if (disp) disp.innerText = formatTime(timer.remaining);
                        } else {
                            clearInterval(timer.intervalId);
                            timer.running = false;
                            timer.intervalId = null;
                            if (!timer.alarmActive) {
                                timer.alarmActive = true;
                                if (timerSound) {
                                    playTimerSound(timerSound);
                                }
                                render();
                            }
                        }
                    }, 1000);
                });
            });

            document.querySelectorAll('[data-action="pauseTimer"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const studentId = e.currentTarget.dataset.student;
                    const timer = timers[state.lessonId][studentId];
                    if (timer && timer.running) {
                        clearInterval(timer.intervalId);
                        timer.running = false;
                        timer.intervalId = null;
                    }
                });
            });

            document.querySelectorAll('[data-action="resetTimer"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const studentId = e.currentTarget.dataset.student;
                    const timer = timers[state.lessonId][studentId];
                    if (timer) {
                        if (timer.running) {
                            clearInterval(timer.intervalId);
                            timer.running = false;
                            timer.intervalId = null;
                        }
                        timer.remaining = defaultTimer;
                        timer.alarmActive = false;
                        const disp = document.getElementById(`timer-${studentId}`);
                        if (disp) disp.innerText = formatTime(defaultTimer);
                        render();
                    }
                });
            });

            document.querySelectorAll('[data-action="stopAlarm"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const studentId = e.currentTarget.dataset.student;
                    const timer = timers[state.lessonId][studentId];
                    if (timer && timer.alarmActive) {
                        timer.alarmActive = false;
                        const studentName = studentMap[studentId].name;
                        showAlert(`Make sure ${studentName} knows what rule they broke and demand an apology.`);
                        render();
                    }
                });
            });

            document.querySelectorAll('.clickable-smile').forEach(el => {
                el.addEventListener('click', async (e) => {
                    const studentId = e.target.dataset.student;
                    const type = e.target.dataset.type;
                    const list = effective.behaviors.filter(b => b.type === type);
                    if (list.length === 0) {
                        showAlert('No behaviors defined for this context. Go to Settings to add some.');
                        return;
                    }
                    const options = list.map(b => `<option value="${b.id}">${escapeHtml(b.description)}</option>`).join('');
                    const selectHtml = `<select id="modalInput" class="modal-input">${options}</select>`;
                    const selectedId = await showModal({ title: `Select ${type} behavior`, bodyHtml: selectHtml, input: true });
                    if (!selectedId) return;
                    const behavior = list.find(b => b.id === selectedId);
                    if (!behavior) return;

                    const newEvent = {
                        id: generateId(),
                        lessonId: state.lessonId,
                        studentId,
                        type,
                        description: behavior.description,
                        timestamp: new Date().toISOString()
                    };
                    data.behaviorEvents.push(newEvent);
                    saveData(data);

                    const updatedInapp = data.behaviorEvents.filter(be => be.lessonId === state.lessonId && be.studentId === studentId && be.type === 'inappropriate').length;
                    const studentObj = data.students.find(s => s.id === studentId);
                    const studentName = studentObj ? studentObj.name : 'Student';

                    if (type === 'inappropriate') {
                        if (updatedInapp === limit) {
                            showAlert(`⚠️ Go to ${studentName}'s level, make eye contact, state the rules that were broken, and explain the consequence: ${consequence}`);
                        }
                    } else {
                        showAlert('😊 Praise the appropriate behavior in front of the class.');
                    }

                    render();
                });
            });

            document.querySelectorAll('.undo-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const studentId = e.currentTarget.dataset.student;
                    const studentEvents = data.behaviorEvents
                        .filter(be => be.lessonId === state.lessonId && be.studentId === studentId)
                        .sort((a, b) => (a.timestamp < b.timestamp ? 1 : -1));
                    if (studentEvents.length === 0) {
                        showAlert('No behavior to undo for this student.');
                        return;
                    }
                    const lastEvent = studentEvents[0];
                    const confirmUndo = await showModal({
                        title: 'Undo last',
                        bodyHtml: `<p>Remove last behavior: "${escapeHtml(lastEvent.description)}"?</p>`,
                        confirmText: 'Undo',
                        cancelText: 'Cancel'
                    });
                    if (confirmUndo) {
                        data.behaviorEvents = data.behaviorEvents.filter(be => be.id !== lastEvent.id);
                        saveData(data);
                        render();
                    }
                });
            });

            document.getElementById('closeLesson')?.addEventListener('click', () => setView('lessons'));
        }

        // ---------- INSTITUTION SETTINGS (with draggable behaviors) ----------
        function renderInstitutionSettings(container, data) {
            const institution = data.institutions.find(i => i.id === state.institutionId);
            if (!institution) { setView('institutions'); return; }
            const effective = getEffectiveSettings(data, institution.id, null);
            const override = institution.override;
            const hasSound = !!override.timerSoundDataURL;

            container.innerHTML = `
                <div class="section-title">
                    <button class="btn" id="backToInstitutions"><i class="fas fa-arrow-left"></i> Institutions</button>
                    <span>⚙️ ${escapeHtml(institution.name)} Settings</span>
                </div>
                <div class="info-note">
                    <i class="fas fa-info-circle"></i> These settings override global settings for all classes in this institution.
                </div>
                <button class="btn btn-sm" id="resetToGlobal">Reset all to global</button>
                <div class="settings-group">
                    <h3>😊 Appropriate behaviors</h3>
                    <div class="behavior-list" id="institutionAppropriateList"></div>
                    <button class="btn btn-sm" id="addInstAppropriate">+ Add appropriate</button>
                </div>
                <div class="settings-group">
                    <h3>😞 Inappropriate behaviors</h3>
                    <div class="behavior-list" id="institutionInappropriateList"></div>
                    <button class="btn btn-sm" id="addInstInappropriate">+ Add inappropriate</button>
                </div>
                <div class="settings-group">
                    <h3>⏱️ Timer default (seconds)</h3>
                    <input type="number" id="defaultTimerInput" value="${override.defaultTimerSeconds !== null ? override.defaultTimerSeconds : effective.defaultTimerSeconds}" min="0" step="1" style="width:120px;">
                </div>
                <div class="settings-group">
                    <h3>🔔 Timer sound (upload MP3/WAV)</h3>
                    <input type="file" id="soundFileInput" accept="audio/*" style="margin-bottom:0.5rem;">
                    <div class="sound-preview" id="soundPreview">${hasSound ? '✅ Custom sound loaded' : 'No custom sound (timer will be silent)'}</div>
                    ${hasSound ? '<button class="btn btn-sm" id="clearSoundBtn">Clear sound</button>' : ''}
                </div>
                <div class="settings-group">
                    <h3>🚦 Limits & consequences</h3>
                    <label>Inappropriate limit</label>
                    <input type="number" id="limitInput" value="${override.limit !== null ? override.limit : effective.limit}" min="1" style="width:100px;">
                    <label class="mt-2">Consequence message</label>
                    <input type="text" id="consequenceInput" value="${escapeHtml(override.consequence !== null ? override.consequence : effective.consequence)}" style="width:100%;">
                    <button class="btn btn-primary mt-2" id="saveInst">Save changes</button>
                </div>
            `;

            renderDraggableBehaviorLists(override.behaviors, 'institution', container, data, institution.id);

            document.getElementById('addInstAppropriate').addEventListener('click', () => addBehavior('institution', 'appropriate', data, container, institution.id, null));
            document.getElementById('addInstInappropriate').addEventListener('click', () => addBehavior('institution', 'inappropriate', data, container, institution.id, null));

            document.getElementById('backToInstitutions').addEventListener('click', () => setView('institutions'));

            document.getElementById('resetToGlobal')?.addEventListener('click', async () => {
                if (await showModal({ title: 'Reset to global', bodyHtml: '<p>This will discard all institution overrides. Continue?</p>' })) {
                    institution.override = { behaviors: [], defaultTimerSeconds: null, timerSoundDataURL: null, limit: null, consequence: null };
                    saveData(data);
                    renderInstitutionSettings(container, data);
                }
            });

            document.getElementById('saveInst')?.addEventListener('click', () => {
                institution.override.defaultTimerSeconds = parseInt(document.getElementById('defaultTimerInput').value) || 0;
                institution.override.limit = parseInt(document.getElementById('limitInput').value) || 1;
                institution.override.consequence = document.getElementById('consequenceInput').value;
                saveData(data);
                showAlert('Institution settings saved.');
                renderInstitutionSettings(container, data);
            });

            const fileInput = document.getElementById('soundFileInput');
            if (fileInput) {
                fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        institution.override.timerSoundDataURL = event.target.result;
                        saveData(data);
                        renderInstitutionSettings(container, data);
                    };
                    reader.readAsDataURL(file);
                });
            }

            const clearSoundBtn = document.getElementById('clearSoundBtn');
            if (clearSoundBtn) {
                clearSoundBtn.addEventListener('click', () => {
                    institution.override.timerSoundDataURL = null;
                    saveData(data);
                    renderInstitutionSettings(container, data);
                });
            }
        }

        // ---------- CLASS SETTINGS (with draggable behaviors) ----------
        function renderClassSettings(container, data) {
            const cls = data.classes.find(c => c.id === state.classId);
            if (!cls) { setView('classes'); return; }
            const institution = data.institutions.find(i => i.id === cls.institutionId);
            const effective = getEffectiveSettings(data, cls.institutionId, cls.id);
            const override = cls.override;
            const hasSound = !!override.timerSoundDataURL;

            container.innerHTML = `
                <div class="section-title">
                    <button class="btn" id="backToClasses"><i class="fas fa-arrow-left"></i> Classes</button>
                    <span>⚙️ ${escapeHtml(cls.name)} Settings</span>
                </div>
                <div class="info-note">
                    <i class="fas fa-info-circle"></i> These settings override global and institution settings for this class only.
                </div>
                <button class="btn btn-sm" id="resetToGlobal">Reset all to global</button>
                <div class="settings-group">
                    <h3>😊 Appropriate behaviors</h3>
                    <div class="behavior-list" id="classAppropriateList"></div>
                    <button class="btn btn-sm" id="addClassAppropriate">+ Add appropriate</button>
                </div>
                <div class="settings-group">
                    <h3>😞 Inappropriate behaviors</h3>
                    <div class="behavior-list" id="classInappropriateList"></div>
                    <button class="btn btn-sm" id="addClassInappropriate">+ Add inappropriate</button>
                </div>
                <div class="settings-group">
                    <h3>⏱️ Timer default (seconds)</h3>
                    <input type="number" id="defaultTimerInput" value="${override.defaultTimerSeconds !== null ? override.defaultTimerSeconds : effective.defaultTimerSeconds}" min="0" step="1" style="width:120px;">
                </div>
                <div class="settings-group">
                    <h3>🔔 Timer sound (upload MP3/WAV)</h3>
                    <input type="file" id="soundFileInput" accept="audio/*" style="margin-bottom:0.5rem;">
                    <div class="sound-preview" id="soundPreview">${hasSound ? '✅ Custom sound loaded' : 'No custom sound (timer will be silent)'}</div>
                    ${hasSound ? '<button class="btn btn-sm" id="clearSoundBtn">Clear sound</button>' : ''}
                </div>
                <div class="settings-group">
                    <h3>🚦 Limits & consequences</h3>
                    <label>Inappropriate limit</label>
                    <input type="number" id="limitInput" value="${override.limit !== null ? override.limit : effective.limit}" min="1" style="width:100px;">
                    <label class="mt-2">Consequence message</label>
                    <input type="text" id="consequenceInput" value="${escapeHtml(override.consequence !== null ? override.consequence : effective.consequence)}" style="width:100%;">
                    <button class="btn btn-primary mt-2" id="saveClass">Save changes</button>
                </div>
            `;

            renderDraggableBehaviorLists(override.behaviors, 'class', container, data, null, cls.id);

            document.getElementById('addClassAppropriate').addEventListener('click', () => addBehavior('class', 'appropriate', data, container, cls.institutionId, cls.id));
            document.getElementById('addClassInappropriate').addEventListener('click', () => addBehavior('class', 'inappropriate', data, container, cls.institutionId, cls.id));

            document.getElementById('backToClasses').addEventListener('click', () => setView('classes'));

            document.getElementById('resetToGlobal')?.addEventListener('click', async () => {
                if (await showModal({ title: 'Reset to global', bodyHtml: '<p>This will discard all class overrides. Continue?</p>' })) {
                    cls.override = { behaviors: [], defaultTimerSeconds: null, timerSoundDataURL: null, limit: null, consequence: null };
                    saveData(data);
                    renderClassSettings(container, data);
                }
            });

            document.getElementById('saveClass')?.addEventListener('click', () => {
                cls.override.defaultTimerSeconds = parseInt(document.getElementById('defaultTimerInput').value) || 0;
                cls.override.limit = parseInt(document.getElementById('limitInput').value) || 1;
                cls.override.consequence = document.getElementById('consequenceInput').value;
                saveData(data);
                showAlert('Class settings saved.');
                renderClassSettings(container, data);
            });

            const fileInput = document.getElementById('soundFileInput');
            if (fileInput) {
                fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        cls.override.timerSoundDataURL = event.target.result;
                        saveData(data);
                        renderClassSettings(container, data);
                    };
                    reader.readAsDataURL(file);
                });
            }

            const clearSoundBtn = document.getElementById('clearSoundBtn');
            if (clearSoundBtn) {
                clearSoundBtn.addEventListener('click', () => {
                    cls.override.timerSoundDataURL = null;
                    saveData(data);
                    renderClassSettings(container, data);
                });
            }
        }

        // ---------- ADD BEHAVIOR (unchanged) ----------
        async function addBehavior(context, type, data, container, institutionId, classId) {
            const method = await new Promise((resolve) => {
                const modalDiv = document.getElementById('customModal');
                document.getElementById('modalTitle').innerText = 'Add behavior';
                document.getElementById('modalBody').innerHTML = `
                    <button class="btn" id="chooseManual" style="width:100%; margin-bottom:10px;">✏️ Manual entry</button>
                    <button class="btn" id="chooseImport" style="width:100%;">📋 Import from column (one per line)</button>
                `;
                const actionsDiv = document.getElementById('modalActions');
                actionsDiv.innerHTML = '<button class="btn" id="cancelAdd">Cancel</button>';
                document.getElementById('cancelAdd').onclick = () => { closeModal(); resolve(null); };
                document.getElementById('chooseManual').onclick = () => { closeModal(); resolve('manual'); };
                document.getElementById('chooseImport').onclick = () => { closeModal(); resolve('import'); };
                modalDiv.classList.add('active');
            });
            if (!method) return;

            if (method === 'manual') {
                const desc = await showModal({ title: `New ${type} behavior`, bodyHtml: '<input id="modalInput" placeholder="Behavior description">', input: true });
                if (desc && desc.trim()) {
                    if (context === 'global') {
                        data.global.behaviors.push({ id: generateId(), type, description: desc.trim() });
                    } else if (context === 'institution') {
                        const inst = data.institutions.find(i => i.id === institutionId);
                        inst.override.behaviors.push({ id: generateId(), type, description: desc.trim() });
                    } else if (context === 'class') {
                        const cls = data.classes.find(c => c.id === classId);
                        cls.override.behaviors.push({ id: generateId(), type, description: desc.trim() });
                    }
                    saveData(data);
                    if (context === 'global') renderGlobalSettings(container, data);
                    else if (context === 'institution') renderInstitutionSettings(container, data);
                    else renderClassSettings(container, data);
                }
            } else {
                const text = await showModal({ title: 'Import names', bodyHtml: '<textarea id="modalInput" rows="6" placeholder="One behavior per line"></textarea>', input: true });
                if (text) {
                    const lines = text.split('\n').map(s => s.trim()).filter(s => s);
                    lines.forEach(desc => {
                        if (context === 'global') {
                            data.global.behaviors.push({ id: generateId(), type, description: desc });
                        } else if (context === 'institution') {
                            const inst = data.institutions.find(i => i.id === institutionId);
                            inst.override.behaviors.push({ id: generateId(), type, description: desc });
                        } else if (context === 'class') {
                            const cls = data.classes.find(c => c.id === classId);
                            cls.override.behaviors.push({ id: generateId(), type, description: desc });
                        }
                    });
                    saveData(data);
                    if (context === 'global') renderGlobalSettings(container, data);
                    else if (context === 'institution') renderInstitutionSettings(container, data);
                    else renderClassSettings(container, data);
                }
            }
        }

        // ---------- REPORTS (unchanged) ----------
        function renderReports(container, data) {
            const classStudents = data.students.filter(s => s.classId === state.classId);
            container.innerHTML = `
                <div class="section-title">
                    <button class="btn" id="backToClasses"><i class="fas fa-arrow-left"></i> Class names</button>
                    <span>📊 Reports · ${escapeHtml(state.className)}</span>
                </div>
                <h3>Select a student to view behavior history</h3>
                <div id="studentReportsList"></div>
            `;
            const listDiv = document.getElementById('studentReportsList');
            if (classStudents.length === 0) {
                listDiv.innerHTML = '<p>No students in this class.</p>';
            } else {
                classStudents.forEach(s => {
                    const div = document.createElement('div');
                    div.className = 'student-row';
                    div.innerHTML = `<span class="student-name">${escapeHtml(s.name)}</span>`;
                    div.addEventListener('click', () => {
                        setView('behaviorHistory', { studentId: s.id, studentName: s.name });
                    });
                    listDiv.appendChild(div);
                });
            }
            document.getElementById('backToClasses').addEventListener('click', () => setView('classes'));
        }

        // ---------- BEHAVIOR HISTORY (unchanged) ----------
        function renderBehaviorHistory(container, data) {
            const student = data.students.find(s => s.id === state.studentId);
            if (!student) {
                container.innerHTML = '<p>Student not found.</p><button class="btn" id="backToReports">Back</button>';
                document.getElementById('backToReports')?.addEventListener('click', () => setView('reports'));
                return;
            }

            const classLessons = data.lessons.filter(l => l.classId === state.classId).sort((a, b) => a.date.localeCompare(b.date));
            const studentEvents = data.behaviorEvents.filter(be => be.studentId === state.studentId);

            const totalPositive = studentEvents.filter(be => be.type === 'appropriate').length;
            const totalNegative = studentEvents.filter(be => be.type === 'inappropriate').length;

            const eventsByLesson = {};
            studentEvents.forEach(be => {
                if (!eventsByLesson[be.lessonId]) eventsByLesson[be.lessonId] = [];
                eventsByLesson[be.lessonId].push(be);
            });

            let html = `
                <div class="section-title">
                    <button class="btn" id="backToReports"><i class="fas fa-arrow-left"></i> Reports</button>
                    <span>📋 ${escapeHtml(student.name)} · History</span>
                </div>
                <div class="totals">
                    <span>😊 Positive: ${totalPositive}</span>
                    <span>😞 Negative: ${totalNegative}</span>
                </div>
                <h3>Days of class</h3>
            `;

            if (classLessons.length === 0) {
                html += '<p>No days found.</p>';
            } else {
                classLessons.forEach(lesson => {
                    const dateStr = new Date(lesson.date + 'T12:00:00').toLocaleDateString();
                    const dayOfWeek = getDayOfWeek(lesson.date);
                    const events = eventsByLesson[lesson.id] || [];
                    const positiveEvents = events.filter(e => e.type === 'appropriate');
                    const negativeEvents = events.filter(e => e.type === 'inappropriate');

                    html += `<div class="history-day">`;
                    html += `<div class="history-day-header">${escapeHtml(dayOfWeek)} ${escapeHtml(dateStr)} ${lesson.archived ? '(archived)' : ''}</div>`;

                    if (positiveEvents.length > 0) {
                        html += `<div><strong>😊 Positive:</strong> `;
                        positiveEvents.forEach(e => {
                            html += `<span class="history-behavior">${escapeHtml(e.description)}</span>`;
                        });
                        html += `</div>`;
                    }
                    if (negativeEvents.length > 0) {
                        html += `<div><strong>😞 Negative:</strong> `;
                        negativeEvents.forEach(e => {
                            html += `<span class="history-behavior">${escapeHtml(e.description)}</span>`;
                        });
                        html += `</div>`;
                    }
                    if (events.length === 0) {
                        html += `<p>No behaviors recorded.</p>`;
                    }
                    html += `</div>`;
                });
            }

            container.innerHTML = html;
            document.getElementById('backToReports')?.addEventListener('click', () => setView('reports'));
        }

        // ---------- INIT ----------
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const view = e.currentTarget.dataset.view;
                if (view === 'institutions') setView('institutions');
                else if (view === 'globalSettings') setView('globalSettings');
            });
        });

        render();
    })();
</script>
</body>
</html>
